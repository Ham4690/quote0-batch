name: 不具合報告
description: バグ・想定外の挙動を報告する(エージェントが修正 PR を作成する前提)
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        この issue は **Claude / Codex が読んで修正 PR を作る入力**になります。
        再現手順と期待結果を具体的に書いてください。実装の依頼は issue コメントに
        `@claude` または `@codex` と書いて行います。
  - type: textarea
    id: actual
    attributes:
      label: 現象
      description: 実際に起きていること。エラー文・ログ・画面の状態など。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1. 〜を設定する
        2. `go run ./cmd/batch` を実行する
        3. 〜になる
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 発生環境
      description: ローカル / GitHub Actions(batch.yml)の別、発生日時(JST)、関連 run の URL など。
  - type: textarea
    id: scope
    attributes:
      label: 修正スコープ(任意)
      description: 疑わしい箇所、今回直さない範囲(ついで修正は別 PR)。
  - type: checkboxes
    id: secret-check
    attributes:
      label: 確認
      options:
        - label: DOT_API_KEY / SERIAL_NUM など秘匿情報を本文・ログに貼っていない
          required: true
