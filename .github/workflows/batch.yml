name: batch

# quote/0 Text API へ実送信するワークフロー。secrets を使うため
# workflow_dispatch / schedule のみで起動する(PR では走らせない)。
#
# M3(天気連携)で毎日 0 時(JST)実行に変更。当日の天気予報を表示する。
on:
  workflow_dispatch: # 手動実行(疎通確認用)
  schedule:
    - cron: "0 15 * * *" # UTC 15:00 = JST 00:00(毎日)。JST は time.LoadLocation で明示取得

permissions:
  contents: read # 最小権限

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production # Environment secrets + 承認ゲートを活用
    timeout-minutes: 10 # setup-go 失敗時の2回目試行分の余裕込み(0004 参照)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        id: setup-go
        continue-on-error: true # GitHub 側の一時的なアクションダウンロード障害を吸収(0004 参照)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false # 外部依存(go.sum)未生成のためキャッシュ無効
      - name: Setup Go (retry)
        if: steps.setup-go.outcome == 'failure'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false
      - name: send to quote/0 Text API
        run: go run ./cmd/batch
        env:
          DOT_API_KEY: ${{ secrets.DOT_API_KEY }}
          SERIAL_NUM: ${{ secrets.SERIAL_NUM }}
          # DOT_BASE_URL は既定値を使うため未設定。JST は time.LoadLocation で
          # 明示取得するため TZ 環境変数は不要。
          #
          # 天気連携(M3)の設定。すべて非秘匿のため Secrets ではなく Variables で注入。
          # 未設定なら code 側の既定値(CITY_CODE=130010 / WEATHER_BASE_URL=tsukumijima)を使う。
          CITY_CODE: ${{ vars.CITY_CODE }}
          WEATHER_BASE_URL: ${{ vars.WEATHER_BASE_URL }}
          WEATHER_LINK_URL: ${{ vars.WEATHER_LINK_URL }}
